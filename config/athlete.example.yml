# Copy to config/athlete.yml (gitignored) and fill in real values.
# Home timezone (IANA name). A day is the local calendar date here; sources
# that store UTC are converted with it. See docs/sources.md.
home_timezone: Europe/Berlin

hr_zones:
  names: [Recovery, Aerobic, Tempo, SubThreshold, SuperThreshold, Aerobic Capacity, Anaerobic]
  # Upper bound (bpm, inclusive) of zones 1-6; zone 7 is everything above.
  # Strava sport types map to ride (Ride, GravelRide, VirtualRide, …),
  # run (Run, TrailRun, VirtualRun) or other.
  upper_bpm:
    ride:  [120, 135, 145, 155, 160, 165]
    run:   [125, 140, 150, 158, 163, 168]
    other: [125, 140, 150, 158, 163, 168]

# Climb matching and effort status (R/climb_matching.R). Method settings.
climbs:
  match_radius_m: 30          # start and end must be passed this close
  path_window: [0.75, 1.35]   # path distance start→end, × climb length …
  path_pad_m: 40              # … + this on the upper bound
  stop_speed_ms: 0.5          # slower than this = stopped
  max_stop_s: 2               # clean: stops add up to at most this
  top_frac: 0.95              # top: every stop at or after this share of the climb
  foot_max_s: 10              # foot: no single stop longer than this
  walk_speed_ms: [0.6, 1.5]   # walk: this speed …
  walk_min_s: 30              # … for at least this long in a row (restarting after a stop creeps ~20 s)
  scope_min_gain_m: 120       # climb record counts rides with at least this much climbing

# Power model (R/power_model.R): an estimate from the physics of the climb,
# for comparing efforts. Method settings except kit mass.
power:
  kit_mass_kg: 2              # clothing, shoes, bottles, tools
  crr:                        # rolling resistance by climb surface
    cobbles: 0.018
    part_cobbles: 0.012
    asphalt: 0.006
  crr_unknown_surface: asphalt  # used, and labelled, while a surface is not set
  cda_m2: 0.45
  rho_kg_m3: 1.2
  drivetrain_eff: 0.97
  g_ms2: 9.81
  uncertainty: 0.15           # shown as ± on every estimate
  min_duration_s: 90          # shorter efforts read high (run-up momentum): flagged
