# Copy to config/goals.yml (gitignored) and fill in real values.

# Strava segments tracked as benchmark climbs. segment_id is a string (Strava
# IDs exceed R's integer range); name is just a label, Strava's name is in
# strava_segments.
benchmark_climbs:
  - {segment_id: "1234567", name: "Example hill"}
  - {segment_id: "7654321", name: "Example long climb"}

# Climbs pinned to the top of the Climb record, by their name in config/climbs.csv
pinned_climbs: [Example Hill]

# Climbs labelled on the Engine chart (e.g. a threshold reference), by name in config/climbs.csv
engine_labels: [Example Hill]
