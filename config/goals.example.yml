# Copy to config/goals.yml (gitignored) and fill in real values.

# Strava segments tracked as benchmark climbs. segment_id is a string (Strava
# IDs exceed R's integer range); name is just a label, Strava's name is in
# strava_segments.
benchmark_climbs:
  - {segment_id: "1234567", name: "Example hill"}
  - {segment_id: "7654321", name: "Example long climb"}

# Climbs pinned to the top of the Climb record, by their name in config/climbs.csv
pinned_climbs: [Example Hill]

# Climbs labelled on the Engine chart (e.g. a threshold reference), by name in config/climbs.csv
engine_labels: [Example Hill]

# Weight goal. The pace line starts at the trend weight on start_date and
# drops rate_kg_per_week, flat for pause_weeks at pause_at_kg, flat again at
# target_kg. catch_up: how a missed week is handled.
weight_goal:
  start_date: 2030-01-06
  rate_kg_per_week: 0.4
  target_kg: 75
  pause_at_kg: 78
  pause_weeks: 1
  checkpoint: 2030-03-01
  catch_up: false

nutrition:
  protein_g_per_day: 150

# Sessions a week, and how they are recognised (one per day per kind at most).
sessions:
  bjj: {per_week: 2, strava_types: [Workout]}
  lifting: {per_week: 3, strava_types: [WeightTraining], macrofactor_workouts: true}

# Strength: targets for each group's main lift (config/lifts.csv), as bar
# weight e1RM, and longer-term ceilings.
strength:
  target_date: 2030-12-31
  targets_kg: {Bench: 100, Squat: 140, "Deadlift and hinge": 170}
  ceilings_kg:
    steady: {Bench: [105, 115], Squat: [150, 160], "Deadlift and hinge": [180, 190]}

# Riding: km per calendar year, the goal ride, and the benchmark climb (by
# its name in config/climbs.csv).
riding:
  annual_km: {2030: 2000}
  goal_ride: {km: 100, gain_m: 800, by: 2030-06-30}
  benchmark_climb: Example Hill
