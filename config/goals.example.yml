# Copy to config/goals.yml (gitignored) and fill in real values.

# Strava segments tracked as benchmark climbs. segment_id is a string (Strava
# IDs exceed R's integer range); name is just a label, Strava's name is in
# strava_segments.
benchmark_climbs:
  - {segment_id: "1234567", name: "Example hill"}
  - {segment_id: "7654321", name: "Example long climb"}

# Climbs pinned to the top of the Climb record, by their name in config/climbs.csv
pinned_climbs: [Example Hill]

# Climbs labelled on the Engine chart (e.g. a threshold reference), by name in config/climbs.csv
engine_labels: [Example Hill]

# Weight goal. The pace line starts at the trend weight on start_date and
# drops rate_kg_per_week, flat for pause_weeks at pause_at_kg, flat again at
# target_kg. catch_up: how a missed week is handled.
weight_goal:
  start_date: 2030-01-06
  rate_kg_per_week: 0.4
  target_kg: 75
  pause_at_kg: 78
  pause_weeks: 1
  checkpoint: 2030-03-01
  catch_up: false

nutrition:
  protein_g_per_day: 150

# Sessions a week, and how they are recognised (one per day per kind at most).
sessions:
  bjj: {per_week: 2, strava_types: [Workout]}
  # logged_sets: a day with working sets in the set log (templates, Strong,
  # MacroFactor) counts; Strava only for days without logged sets
  lifting: {per_week: 3, strava_types: [WeightTraining], logged_sets: true}

# Strength: targets for each group's main lift (config/lifts.csv), as the
# heavy single on the bar, a number or [low, high]. The single source for
# the Strength tab (drawn on the e1RM scale: target / single ratio), the
# Quest Board, scenarios and the forecast (R/plan_config.R).
strength:
  target_date: 2030-12-31
  targets_kg: {Bench: 100, Squat: 140, "Deadlift and hinge": [170, 175]}   # heavy single on the bar
  # A checkpoint on the way, on the bar, by exercise: the quest card and a
  # Roadmap gate naming it (checkpoint: <quest id>) tick when it is met
  checkpoints_kg: {"Barbell Back Squat": {date: 2030-06-30, value: 125}}

# Riding: km per calendar year, the goal ride, and the benchmark climb (by
# its name in config/climbs.csv).
riding:
  annual_km: {2030: 2000}
  goal_ride: {km: 100, gain_m: 800, by: 2030-06-30}
  benchmark_climb: Example Hill

# Strength forecast: where each main lift's current round is heading, on a
# plateau curve with ceiling = aptitude x elite line (R/forecast.R). Lift
# keys map to exact exercise names; only the exact lift counts as training
# time. thresholds_bw: a load to have lifted, times bodyweight.
strength_forecast:
  exercises:
    squat:    "Barbell Back Squat"
    bench:    "Barbell Bench Press"
    deadlift: "Conventional Deadlift"
  # targets: derived from strength.targets_kg (on the bar / single ratio).
  # variants: ratio = variant e1RM / the lift's e1RM. A lift without a
  # forecast of its own borrows a parent's curve (ceiling x ratio), and
  # Analytics puts every variant on the lift's scale (e1RM / ratio).
  # placeholder: true = not converted yet (a ratio still to settle).
  variants:
    "Front Squat":               {lift: squat, ratio: 0.8, placeholder: true}
    "Pause Barbell Bench Press": {lift: bench, ratio: 0.9}
  thresholds_bw: {bench: 1.0, squat: 1.25, deadlift: 1.5}
  single_ratio: {bench: 0.96, squat: 0.98, deadlift: 0.99}   # single / 2-6-rep e1RM
  threshold_bodyweight_kg: 80
  round_start: 2030-01-01
  gap_cap_days: 14               # a gap between two sessions of the lift counts at most this long
  min_sessions_fit: 8            # fewer sessions: start value and a fixed tau
  horizon: 2032-12-31
  start_override:
    squat: {date: 2030-03-01, e1rm_kg: 100, note: "invented"}
  first_round:                   # an earlier round's fit; t = months since origin
    origin: 2025-01-01
    fitted_until: 2026-12-31
    squat:    {exp: {c: 130, y0: 60, tau: 9},  log: {a: 55, b: 30, s: 2}}
    bench:    {exp: {c: 100, y0: 70, tau: 5},  log: {a: 68, b: 8,  s: 0.5}}
    deadlift: {exp: {c: 160, y0: 90, tau: 11}, log: {a: 88, b: 30, s: 4}}

# Ceilings: aptitude (fraction of the elite line, from fat-free mass per cm)
# for p10, p50 (default) and p90.
strength_ceilings:
  target_body: {bodyweight_kg: 80, body_fat: 0.15, height_cm: 180}
  aptitude:
    squat:    [0.60, 0.75, 0.95]
    bench:    [0.65, 0.75, 0.90]
    deadlift: [0.65, 0.78, 0.95]
